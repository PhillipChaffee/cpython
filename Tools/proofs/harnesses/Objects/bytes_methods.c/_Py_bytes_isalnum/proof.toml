reason = "p starts at cptr and steps by 1 to e = cptr + len with len >= 0, so p < e and p != e agree on every iteration"

[[equivalent_mutants]]
diff = "if (len == 1 && Py_ISALNUM(*p)) ==> if (len == (1==1) && Py_ISALNUM(*p))"
reason = "(1==1) is the int 1, so the condition is unchanged"

[[equivalent_mutants]]
diff = "if (len == 0) ==> if (len <= 0)"
reason = "len >= 0 (caller contract and harness assumption), so len <= 0 is len == 0"

[[equivalent_mutants]]
